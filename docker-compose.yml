version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: trip_ticket_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trip_ticket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trip_ticket_pw}
      POSTGRES_DB: ${POSTGRES_DB:-trip_ticket_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trip_ticket}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trip_ticket_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    command: sh -c "npx prisma migrate deploy && npm run dev"

  # Optional: web UI to inspect the database. Visit http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4
    container_name: trip_ticket_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tripticket.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
